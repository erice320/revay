<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=800" />
<title>EXECUTE — A Rev.io Summit 2026 Film</title>
<style>
  :root {
    --bg: #050810;
    --blue: #00b4ff;
    --cyan: #00ffff;
    --amber: #ff9500;
    --ember: #ff5a1f;
    --teal: #00d4aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 24px 0;
  }

  .poster {
    position: relative;
    width: 800px;
    height: 1200px;
    background: radial-gradient(ellipse at 50% 35%, #0a1428 0%, #05070e 55%, #020308 100%);
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.04);
    border-radius: 4px;
    isolation: isolate;
  }

  /* ---------- Starfield ---------- */
  .stars, .stars-bright, .stars-far {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .stars::before, .stars::after,
  .stars-bright::before, .stars-bright::after,
  .stars-far::before {
    content: "";
    position: absolute;
    inset: 0;
    background-repeat: repeat;
  }
  .stars-far::before {
    background-image:
      radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 120px 200px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 250px 90px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 380px 300px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 520px 150px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 680px 250px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 760px 80px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 60px 400px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 200px 500px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 430px 600px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 600px 450px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 720px 700px, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 150px 800px, rgba(255,255,255,0.45), transparent),
      radial-gradient(1px 1px at 340px 900px, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 500px 1050px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 670px 1150px, rgba(255,255,255,0.5), transparent);
    background-size: 800px 1200px;
    animation: twinkle 6s ease-in-out infinite;
  }
  .stars::before {
    background-image:
      radial-gradient(1.5px 1.5px at 90px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 310px 220px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 450px 350px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 640px 410px, #ffe9bf, transparent),
      radial-gradient(1.5px 1.5px at 170px 550px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 390px 720px, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 570px 880px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 740px 1000px, #ffe9bf, transparent),
      radial-gradient(1.5px 1.5px at 40px 1020px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 240px 1140px, #cfe8ff, transparent);
    background-size: 800px 1200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars-bright::before {
    background-image:
      radial-gradient(2px 2px at 130px 180px, #fff, transparent 60%),
      radial-gradient(2px 2px at 540px 260px, #fff, transparent 60%),
      radial-gradient(2px 2px at 290px 470px, #fff, transparent 60%),
      radial-gradient(2.5px 2.5px at 700px 560px, #fff, transparent 60%),
      radial-gradient(2px 2px at 110px 760px, #fff, transparent 60%),
      radial-gradient(2px 2px at 480px 1000px, #fff, transparent 60%);
    background-size: 800px 1200px;
    animation: twinkle-bright 3s ease-in-out infinite;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.6));
  }
  .stars-bright::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(3px 3px at 620px 120px, #fff, transparent 55%),
      radial-gradient(3px 3px at 220px 980px, #fff, transparent 55%);
    background-size: 800px 1200px;
    animation: twinkle-bright 5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 0.4; }
  }
  @keyframes twinkle-bright {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* ---------- Nebula glow ---------- */
  .nebula-blue {
    position: absolute;
    left: -140px;
    top: 260px;
    width: 560px;
    height: 560px;
    background: radial-gradient(circle, rgba(0,120,200,0.35) 0%, rgba(0,60,140,0.18) 35%, transparent 70%);
    filter: blur(20px);
    pointer-events: none;
  }
  .nebula-amber {
    position: absolute;
    right: -120px;
    top: 540px;
    width: 520px;
    height: 520px;
    background: radial-gradient(circle, rgba(255,130,40,0.28) 0%, rgba(220,60,20,0.12) 40%, transparent 70%);
    filter: blur(22px);
    pointer-events: none;
  }

  /* ---------- Mars (distant planet) ---------- */
  .mars {
    position: absolute;
    right: 90px;
    top: 500px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #ffb27a 0%, #e8622a 30%, #9c3410 65%, #4a1706 100%);
    box-shadow:
      inset -30px -20px 60px rgba(0,0,0,0.65),
      inset 18px 14px 40px rgba(255,200,140,0.35),
      0 0 60px rgba(255,120,40,0.35),
      0 0 120px rgba(255,90,30,0.2);
    z-index: 2;
  }
  .mars::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 55% 40%, rgba(90,30,10,0.55) 0 4%, transparent 5%),
      radial-gradient(circle at 35% 65%, rgba(80,25,8,0.5) 0 5%, transparent 6%),
      radial-gradient(circle at 70% 70%, rgba(60,20,5,0.45) 0 3%, transparent 4%),
      radial-gradient(circle at 25% 35%, rgba(100,35,12,0.4) 0 2%, transparent 3%);
    mix-blend-mode: multiply;
  }
  .mars-halo {
    position: absolute;
    right: 50px;
    top: 460px;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,120,40,0.22) 0%, transparent 60%);
    filter: blur(8px);
    z-index: 1;
  }

  /* ---------- Ship ---------- */
  .ship-stage {
    position: absolute;
    left: 50%;
    top: 430px;
    transform: translateX(-50%);
    width: 480px;
    height: 360px;
    z-index: 5;
  }
  .ship-drift { animation: drift 9s ease-in-out infinite; width: 100%; height: 100%; position: relative; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-10px) rotate(-5deg); }
  }

  .exhaust {
    position: absolute;
    left: 8px;
    top: 195px;
    width: 240px;
    height: 60px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,180,80,0.15) 20%,
      rgba(255,110,30,0.55) 55%,
      rgba(255,200,120,0.9) 80%,
      rgba(255,255,255,1) 100%);
    border-radius: 50%;
    filter: blur(10px);
    transform-origin: right center;
    animation: exhaust-pulse 0.6s ease-in-out infinite alternate;
  }
  .exhaust.glow2 {
    left: 30px;
    top: 205px;
    width: 200px;
    height: 40px;
    background: linear-gradient(90deg,
      rgba(0,180,255,0) 0%,
      rgba(0,200,255,0.4) 30%,
      rgba(180,240,255,0.9) 70%,
      rgba(255,255,255,1) 100%);
    filter: blur(6px);
    animation-duration: 0.4s;
  }
  @keyframes exhaust-pulse {
    0% { opacity: 0.75; transform: scaleX(0.92); }
    100% { opacity: 1; transform: scaleX(1.05); }
  }

  .ship {
    position: absolute;
    left: 180px;
    top: 140px;
    width: 280px;
    height: 120px;
    transform: rotate(-5deg);
  }
  /* Main hull */
  .hull {
    position: absolute;
    left: 40px;
    top: 38px;
    width: 200px;
    height: 44px;
    background: linear-gradient(180deg, #d4dce4 0%, #8893a3 40%, #4a525c 75%, #2a3038 100%);
    border-radius: 22px 4px 4px 22px;
    box-shadow:
      inset 0 -6px 10px rgba(0,0,0,0.5),
      inset 0 3px 4px rgba(255,255,255,0.35),
      0 0 14px rgba(0,180,255,0.25);
  }
  .hull::before {
    content: "";
    position: absolute;
    left: 15%;
    right: 12%;
    top: 42%;
    height: 2px;
    background: rgba(0,0,0,0.55);
  }
  /* Nose / cockpit */
  .nose {
    position: absolute;
    right: 0;
    top: 36px;
    width: 60px;
    height: 48px;
    background: linear-gradient(180deg, #b8c2cc 0%, #6a7380 60%, #2c323b 100%);
    border-radius: 0 30px 30px 0;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
  }
  .cockpit {
    position: absolute;
    right: 12px;
    top: 46px;
    width: 34px;
    height: 22px;
    background: radial-gradient(ellipse at 40% 40%, #ffcc66 0%, #ff9a2a 45%, #b04a0f 100%);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(255,160,60,0.85), inset 0 0 6px rgba(255,230,180,0.8);
  }
  /* Booster engines at back */
  .engine {
    position: absolute;
    left: 28px;
    top: 48px;
    width: 26px;
    height: 26px;
    background: radial-gradient(circle at 65% 50%, #ffffff 0%, #ffd37a 30%, #ff7a1a 70%, #5a1a05 100%);
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(255,140,40,0.9), 0 0 36px rgba(255,90,20,0.5);
    animation: engine-pulse 0.5s ease-in-out infinite alternate;
  }
  .engine.e2 { top: 20px; left: 36px; width: 18px; height: 18px; animation-duration: 0.7s; }
  .engine.e3 { top: 78px; left: 36px; width: 18px; height: 18px; animation-duration: 0.6s; }
  @keyframes engine-pulse {
    0% { transform: scale(0.92); filter: brightness(0.9); }
    100% { transform: scale(1.08); filter: brightness(1.15); }
  }
  /* Solar panel wings */
  .wing {
    position: absolute;
    left: 80px;
    width: 110px;
    height: 10px;
    background: repeating-linear-gradient(90deg, #0a2038 0 10px, #0d2a48 10px 20px);
    border: 1px solid #1a3a5c;
    box-shadow: 0 0 10px rgba(0,120,200,0.35);
  }
  .wing.top { top: 20px; }
  .wing.bottom { top: 90px; }

  /* Structural struts */
  .strut {
    position: absolute;
    left: 110px;
    width: 2px;
    height: 18px;
    background: #4a525c;
  }
  .strut.top { top: 30px; }
  .strut.bottom { top: 82px; }

  /* Antenna */
  .antenna {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 2px;
    height: 16px;
    background: #a0a8b2;
  }
  .antenna::after {
    content: "";
    position: absolute;
    top: -4px;
    left: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ffff;
    box-shadow: 0 0 8px #00ffff;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 60%, 100% { opacity: 1; }
    70%, 80% { opacity: 0.15; }
  }

  /* ---------- Revii orbit ---------- */
  .revii-orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 280px;
    height: 280px;
    margin-left: -140px;
    margin-top: -140px;
    animation: orbit 8s linear infinite;
    z-index: 6;
  }
  @keyframes orbit {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .revii {
    position: absolute;
    left: 50%;
    top: 0;
    width: 44px;
    height: 44px;
    margin-left: -22px;
    animation: counter-spin 8s linear infinite;
  }
  @keyframes counter-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  .revii svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 8px rgba(0,212,170,0.9)) drop-shadow(0 0 14px rgba(0,212,170,0.5));
  }

  /* Orbit trail */
  .orbit-ring {
    position: absolute;
    left: 50%;
    top: 590px;
    width: 320px;
    height: 320px;
    margin-left: -160px;
    border: 1px dashed rgba(0,212,170,0.25);
    border-radius: 50%;
    transform: rotateX(70deg);
    z-index: 4;
  }

  /* ---------- EXECUTE logo placement ---------- */
  .execute-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 880px;
    width: 680px;
    text-align: center;
    z-index: 10;
  }
  .execute-wrap img {
    width: 100%;
    height: auto;
    display: block;
    filter:
      drop-shadow(0 0 18px rgba(0,212,170,0.55))
      drop-shadow(0 0 34px rgba(0,180,255,0.35));
  }

  .subtitle {
    margin-top: 18px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.55em;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    text-align: center;
  }

  .tagline {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 1030px;
    width: 700px;
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 200;
    font-style: italic;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #e4ecf5;
    text-shadow: 0 2px 18px rgba(0,0,0,0.9);
    z-index: 10;
  }

  /* ---------- Top crest ---------- */
  .top-crest {
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }
  .top-crest .kicker {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.6em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }
  .top-crest .presenter {
    margin-top: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: #fff;
    text-transform: uppercase;
  }
  .rule {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,180,255,0.8), transparent);
    margin: 10px auto 0;
  }

  /* ---------- Bottom block ---------- */
  .bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 40px 24px;
    z-index: 11;
  }
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    margin-bottom: 18px;
  }
  .logo-row .summit {
    width: 230px;
    height: auto;
    opacity: 0.96;
    border-radius: 3px;
  }
  .logo-row .revio {
    width: 150px;
    height: auto;
    opacity: 0.95;
  }
  .logo-divider {
    width: 1px;
    height: 60px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.35), transparent);
  }

  .billing {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.45em;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    margin: 10px 0 10px;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    padding: 0 4px;
  }
  .rating {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.6);
    padding: 6px 10px;
    letter-spacing: 0.22em;
    color: #fff;
    font-weight: 600;
    font-size: 10px;
    background: rgba(0,0,0,0.3);
  }
  .rating strong {
    font-size: 14px;
    letter-spacing: 0.1em;
    margin-right: 8px;
    padding-right: 8px;
    border-right: 1px solid rgba(255,255,255,0.5);
  }

  /* top/bottom edge strips */
  .edge-top, .edge-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,180,255,0.5), transparent);
    z-index: 12;
  }
  .edge-top { top: 86px; }
  .edge-bottom { bottom: 150px; }

  /* Lens flare over ship */
  .flare {
    position: absolute;
    left: 50%;
    top: 560px;
    width: 520px;
    height: 4px;
    margin-left: -260px;
    background: linear-gradient(90deg, transparent, rgba(180,220,255,0.6), rgba(255,255,255,0.9), rgba(180,220,255,0.6), transparent);
    filter: blur(1.5px);
    opacity: 0.7;
    z-index: 7;
    animation: flare-pulse 4s ease-in-out infinite;
  }
  @keyframes flare-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.8; }
  }

  /* vignette */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 85%, rgba(0,0,0,0.9) 100%);
    z-index: 14;
  }
  /* grain */
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    z-index: 15;
  }
</style>
</head>
<body>
  <div class="poster">

    <!-- Starfield -->
    <div class="stars-far"></div>
    <div class="stars"></div>
    <div class="stars-bright"></div>

    <!-- Nebulae -->
    <div class="nebula-blue"></div>
    <div class="nebula-amber"></div>

    <!-- Top crest -->
    <div class="top-crest">
      <div class="kicker">REV.IO PICTURES PRESENTS</div>
      <div class="rule"></div>
      <div class="presenter">AN ANNUAL CLIENT SUMMIT FEATURE</div>
    </div>
    <div class="edge-top"></div>

    <!-- Mars + halo -->
    <div class="mars-halo"></div>
    <div class="mars"></div>

    <!-- Orbit ring (flat, under ship) -->
    <div class="orbit-ring"></div>

    <!-- Ship Stage -->
    <div class="ship-stage">
      <div class="ship-drift">
        <div class="exhaust"></div>
        <div class="exhaust glow2"></div>
        <div class="ship">
          <div class="wing top"></div>
          <div class="wing bottom"></div>
          <div class="strut top"></div>
          <div class="strut bottom"></div>
          <div class="hull"></div>
          <div class="nose"></div>
          <div class="cockpit"></div>
          <div class="engine"></div>
          <div class="engine e2"></div>
          <div class="engine e3"></div>
          <div class="antenna"></div>
        </div>
      </div>
    </div>

    <!-- Revii orbit glyph -->
    <div class="revii-orbit">
      <div class="revii">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7cf5d1"/>
              <stop offset="55%" stop-color="#00d4aa"/>
              <stop offset="100%" stop-color="#009a7a"/>
            </linearGradient>
          </defs>
          <!-- Circular arrow (3/4 ring with arrowhead) -->
          <path d="M32,8 A24,24 0 1,1 8,32"
                fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round"/>
          <polygon points="26,5 38,8 30,17" fill="url(#rg)"/>
          <!-- 4-pointed star inside -->
          <path d="M32 20 L34.4 29.6 L44 32 L34.4 34.4 L32 44 L29.6 34.4 L20 32 L29.6 29.6 Z"
                fill="url(#rg)"/>
        </svg>
      </div>
    </div>

    <!-- Lens flare -->
    <div class="flare"></div>
