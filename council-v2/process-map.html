<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Council v2 Process Map</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #222637;
      --text: #e8eaf6;
      --muted: #aab0c5;
      --line: #596078;
      --packet: #6c63ff;
      --agent: #00a7b5;
      --evidence: #00d4aa;
      --decision: #f0b84a;
      --risk: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.12;
      font-weight: 720;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      max-width: 840px;
      font-size: 15px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      padding-bottom: 4px;
    }

    .diagram-wrap {
      background: var(--surface);
      border: 1px solid #2b3042;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
    }

    svg {
      display: block;
      min-width: 1280px;
      width: 100%;
      height: auto;
      background: var(--surface);
    }

    .lane-label {
      font-size: 16px;
      font-weight: 700;
      fill: var(--text);
    }

    .lane-note, .caption, .small {
      font-size: 12px;
      fill: var(--muted);
    }

    .node-title {
      font-size: 15px;
      font-weight: 700;
      fill: var(--text);
    }

    .node-body {
      font-size: 12px;
      fill: var(--muted);
    }

    .tag {
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }

    .legend-text {
      font-size: 12px;
      fill: var(--muted);
    }

    .phase {
      font-size: 13px;
      fill: var(--muted);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Rev.io Glass / Council v2 Process Map</h1>
        <p>Current operating model: Notion is the source of truth, Discord/Teams are notification layers, and each Council item moves through bounded packets, evidence-backed contributions, synthesis, human decision, and action capture.</p>
      </div>
      <div class="meta">Updated 2026-05-29</div>
    </header>

    <section class="diagram-wrap" aria-label="Council v2 process map">
      <svg viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
        <title id="title">Council v2 process map</title>
        <desc id="desc">A swimlane diagram showing how executive questions become packets, routed agent asks, source-backed contributions, syntheses, decisions, actions, and Command Center outputs.</desc>

        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f96ad"></path>
          </marker>
          <style>
            .lane-bg { fill: #151823; }
            .lane-alt { fill: #181c29; }
            .lane-line { stroke: #2c3144; stroke-width: 1; }
            .node { stroke-width: 1.4; rx: 8; ry: 8; }
            .human { fill: #242032; stroke: #6c63ff; }
            .notion { fill: #1d2730; stroke: #00a7b5; }
            .agent { fill: #182b2d; stroke: #00a7b5; }
            .evidence { fill: #173029; stroke: #00d4aa; }
            .decision { fill: #302a18; stroke: #f0b84a; }
            .risk { fill: #331d23; stroke: #ff6b6b; }
            .output { fill: #1f2634; stroke: #aab0c5; }
            .flow { stroke: #8f96ad; stroke-width: 2; marker-end: url(#arrow); fill: none; }
            .soft-flow { stroke: #596078; stroke-width: 1.5; marker-end: url(#arrow); fill: none; stroke-dasharray: 6 6; }
            .guardrail { fill: #161923; stroke: #596078; stroke-width: 1; rx: 8; ry: 8; }
          </style>
        </defs>

        <rect x="0" y="0" width="1440" height="900" fill="#0f1117"></rect>

        <rect class="lane-bg" x="36" y="78" width="1368" height="128"></rect>
        <rect class="lane-alt" x="36" y="206" width="1368" height="214"></rect>
        <rect class="lane-bg" x="36" y="420" width="1368" height="170"></rect>
        <rect class="lane-alt" x="36" y="590" width="1368" height="150"></rect>
        <rect class="lane-bg" x="36" y="740" width="1368" height="104"></rect>

        <line class="lane-line" x1="36" y1="206" x2="1404" y2="206"></line>
        <line class="lane-line" x1="36" y1="420" x2="1404" y2="420"></line>
        <line class="lane-line" x1="36" y1="590" x2="1404" y2="590"></line>
        <line class="lane-line" x1="36" y1="740" x2="1404" y2="740"></line>

        <text class="lane-label" x="58" y="108">Human / Revay</text>
        <text class="lane-note" x="58" y="130">Frames bounded work, synthesizes, escalates</text>
        <text class="lane-label" x="58" y="236">Notion Vault</text>
        <text class="lane-note" x="58" y="258">Canonical packet, inbox, outbox, synthesis, decision, action records</text>
        <text class="lane-label" x="58" y="450">Partner Agents</text>
        <text class="lane-note" x="58" y="472">Own inbox/outbox and domain response</text>
        <text class="lane-label" x="58" y="620">Evidence Gate</text>
        <text class="lane-note" x="58" y="642">No silent assumptions, no fabricated records</text>
        <text class="lane-label" x="58" y="770">Executive Surfaces</text>
        <text class="lane-note" x="58" y="792">Command Center, board prep, action queue</text>

        <text class="phase" x="246" y="60">1. Define</text>
        <text class="phase" x="434" y="60">2. Dispatch</text>
        <text class="phase" x="650" y="60">3. Contribute</text>
        <text class="phase" x="892" y="60">4. Validate</text>
        <text class="phase" x="1082" y="60">5. Decide</text>
        <text class="phase" x="1262" y="60">6. Learn</text>

        <rect class="node human" x="210" y="104" width="170" height="78"></rect>
        <text class="node-title" x="234" y="132">Executive Ask</text>
        <text class="node-body" x="234" y="154">A bounded question,</text>
        <text class="node-body" x="234" y="171">not open debate</text>

        <rect class="node notion" x="410" y="246" width="178" height="94"></rect>
        <text class="node-title" x="434" y="274">Packet</text>
        <text class="node-body" x="434" y="296">Objective, scope,</text>
        <text class="node-body" x="434" y="313">contributors, SLA,</text>
        <text class="node-body" x="434" y="330">output contract</text>

        <rect class="node notion" x="628" y="246" width="192" height="94"></rect>
        <text class="node-title" x="652" y="274">Agent Inboxes</text>
        <text class="node-body" x="652" y="296">Assigned asks link</text>
        <text class="node-body" x="652" y="313">back to packet</text>
        <text class="node-body" x="652" y="330">and due date</text>

        <rect class="node agent" x="615" y="456" width="220" height="92"></rect>
        <text class="node-title" x="639" y="484">Domain Response</text>
        <text class="node-body" x="639" y="506">Signal, risk,</text>
        <text class="node-body" x="639" y="523">recommendation,</text>
        <text class="node-body" x="639" y="540">confidence, ask</text>

        <rect class="node evidence" x="868" y="456" width="210" height="92"></rect>
        <text class="node-title" x="892" y="484">Source Retrieval</text>
        <text class="node-body" x="892" y="506">Record counts, links,</text>
        <text class="node-body" x="892" y="523">timestamps, raw errors</text>
        <text class="node-body" x="892" y="540">when failed</text>

        <rect class="node notion" x="890" y="246" width="200" height="94"></rect>
        <text class="node-title" x="914" y="274">Outbox Contribution</text>
        <text class="node-body" x="914" y="296">Append-only page</text>
        <text class="node-body" x="914" y="313">using the contract</text>
        <text class="node-body" x="914" y="330">per agent</text>

        <rect class="node risk" x="864" y="630" width="218" height="74"></rect>
        <text class="node-title" x="888" y="658">Evidence Readiness</text>
        <text class="node-body" x="888" y="680">Complete, partial, failed,</text>
        <text class="node-body" x="888" y="697">or stale snapshot</text>

        <rect class="node notion" x="1134" y="246" width="192" height="94"></rect>
        <text class="node-title" x="1158" y="274">Synthesis</text>
        <text class="node-body" x="1158" y="296">Agreement, dissent,</text>
        <text class="node-body" x="1158" y="313">evidence quality,</text>
        <text class="node-body" x="1158" y="330">options, risks</text>

        <rect class="node decision" x="1122" y="104" width="190" height="78"></rect>
        <text class="node-title" x="1146" y="132">Human Decision</text>
        <text class="node-body" x="1146" y="154">Accept, reject, defer,</text>
        <text class="node-body" x="1146" y="171">or ask for data</text>

        <rect class="node notion" x="1120" y="630" width="196" height="74"></rect>
        <text class="node-title" x="1144" y="658">Action Records</text>
        <text class="node-body" x="1144" y="680">Owner, next move,</text>
        <text class="node-body" x="1144" y="697">status, outcome</text>

        <rect class="node output" x="1160" y="772" width="198" height="52"></rect>
        <text class="node-title" x="1184" y="802">Command Center</text>
        <text class="node-body" x="1184" y="819">Ledger + action queue</text>

        <path class="flow" d="M 380 143 C 408 143 390 293 410 293"></path>
        <path class="flow" d="M 588 293 L 628 293"></path>
        <path class="flow" d="M 724 340 L 724 456"></path>
        <path class="flow" d="M 835 502 L 868 502"></path>
        <path class="flow" d="M 973 456 L 973 340"></path>
        <path class="flow" d="M 1090 293 L 1134 293"></path>
        <path class="flow" d="M 1218 246 L 1218 182"></path>
        <path class="flow" d="M 1218 182 C 1218 214 1218 598 1218 630"></path>
        <path class="flow" d="M 1218 704 L 1258 772"></path>
        <path class="soft-flow" d="M 973 548 L 973 630"></path>
        <path class="soft-flow" d="M 1082 667 L 1120 667"></path>
        <path class="soft-flow" d="M 1326 293 C 1364 328 1364 770 1358 798"></path>

        <rect class="guardrail" x="210" y="630" width="220" height="74"></rect>
        <text class="node-title" x="234" y="658">Anti-Bias Directive</text>
        <text class="node-body" x="234" y="680">Hypotheses are inputs,</text>
        <text class="node-body" x="234" y="697">not conclusions</text>

        <rect class="guardrail" x="460" y="630" width="230" height="74"></rect>
        <text class="node-title" x="484" y="658">No Silent Agreement</text>
        <text class="node-body" x="484" y="680">Missing input is listed</text>
        <text class="node-body" x="484" y="697">as missing or blocked</text>

        <rect class="guardrail" x="210" y="772" width="830" height="52"></rect>
        <text class="node-title" x="234" y="802">Operating Boundary</text>
        <text class="node-body" x="380" y="802">Notion is canonical. Chat only notifies and links. Agents write their own outboxes, not master packets or peer contributions.</text>

        <rect x="1092" y="22" width="264" height="46" rx="8" ry="8" fill="#151823" stroke="#2c3144"></rect>
        <circle cx="1116" cy="45" r="6" fill="#6c63ff"></circle>
        <text class="legend-text" x="1130" y="49">Packet / Revay</text>
        <circle cx="1230" cy="45" r="6" fill="#00a7b5"></circle>
        <text class="legend-text" x="1244" y="49">Agent / Vault</text>
        <circle cx="1116" cy="62" r="6" fill="#00d4aa"></circle>
        <text class="legend-text" x="1130" y="66">Evidence</text>
        <circle cx="1230" cy="62" r="6" fill="#f0b84a"></circle>
        <text class="legend-text" x="1244" y="66">Decision</text>
      </svg>
    </section>
  </main>
</body>
</html>
