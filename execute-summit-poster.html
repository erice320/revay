<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXECUTE — A Rev.io Summit 2026 Film</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;700&family=Roboto+Condensed:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Oswald', sans-serif;
    overflow: hidden;
  }

  .poster {
    width: 700px;
    height: 1050px;
    position: relative;
    overflow: hidden;
    background: #020408;
    box-shadow: 0 0 80px rgba(0, 150, 255, 0.15), 0 0 200px rgba(0, 50, 120, 0.08);
  }

  /* === STAR FIELD === */
  .starfield {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  .starfield::before,
  .starfield::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 25% 8%, rgba(200,220,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 40% 22%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 55% 5%, rgba(180,200,255,0.6), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 85% 12%, rgba(200,230,255,0.8), transparent),
      radial-gradient(1px 1px at 15% 35%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 33% 42%, rgba(220,240,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 65% 38%, rgba(200,210,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 28%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 92% 35%, rgba(190,220,255,0.6), transparent),
      radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 20% 48%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 45% 58%, rgba(210,230,255,0.5), transparent),
      radial-gradient(1px 1px at 60% 52%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(200,220,255,0.5), transparent),
      radial-gradient(1px 1px at 8% 68%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 28% 72%, rgba(220,240,255,0.4), transparent),
      radial-gradient(1px 1px at 42% 65%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 58% 75%, rgba(200,210,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 72% 62%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 88% 70%, rgba(210,230,255,0.6), transparent),
      radial-gradient(1px 1px at 12% 82%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 35% 88%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 52% 85%, rgba(200,220,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 68% 90%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 82% 82%, rgba(220,240,255,0.5), transparent),
      radial-gradient(1px 1px at 95% 88%, rgba(255,255,255,0.8), transparent);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .starfield::after {
    opacity: 0.6;
    transform: scale(1.1) rotate(15deg);
    animation-delay: -2s;
    animation-duration: 5s;
  }

  @keyframes twinkle {
    0% { opacity: 0.7; }
    50% { opacity: 1; }
    100% { opacity: 0.75; }
  }

  /* === DEEP SPACE NEBULA GRADIENT === */
  .nebula {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(10, 30, 80, 0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(20, 10, 60, 0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(5, 20, 50, 0.5) 0%, transparent 40%);
  }

  /* === MARS (destination planet) === */
  .mars {
    position: absolute;
    top: 60px;
    right: 40px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d4734a, #a0422a 40%, #7a2e1e 70%, #3d1510 100%);
    box-shadow:
      0 0 40px rgba(212, 115, 74, 0.3),
      0 0 80px rgba(160, 66, 42, 0.15),
      inset -20px -10px 40px rgba(0,0,0,0.6);
    z-index: 3;
    animation: mars-glow 6s ease-in-out infinite alternate;
  }
  .mars::before {
    content: '';
    position: absolute;
    top: 20%; left: 15%;
    width: 30%; height: 8%;
    background: rgba(180,90,50,0.4);
    border-radius: 50%;
    transform: rotate(-15deg);
  }
  .mars::after {
    content: '';
    position: absolute;
    top: 55%; left: 35%;
    width: 25%; height: 6%;
    background: rgba(200,100,60,0.3);
    border-radius: 50%;
    transform: rotate(10deg);
  }

  @keyframes mars-glow {
    0% { box-shadow: 0 0 40px rgba(212,115,74,0.3), 0 0 80px rgba(160,66,42,0.15), inset -20px -10px 40px rgba(0,0,0,0.6); }
    100% { box-shadow: 0 0 50px rgba(212,115,74,0.4), 0 0 100px rgba(160,66,42,0.2), inset -20px -10px 40px rgba(0,0,0,0.6); }
  }

  /* === MOON SURFACE (bottom landscape) === */
  .moon-surface {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 220px;
    z-index: 4;
    background:
      radial-gradient(ellipse at 20% 100%, rgba(80,80,90,0.8) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(70,70,80,0.6) 0%, transparent 40%),
      linear-gradient(to top, #1a1a22 0%, #12121a 40%, transparent 100%);
  }
  .moon-surface::before {
    content: '';
    position: absolute;
    bottom: 20px;
    left: 10%;
    width: 80%;
    height: 3px;
    background: linear-gradient(to right, transparent, rgba(100,100,120,0.3), transparent);
  }

  /* === SPACECRAFT === */
  .spacecraft-container {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 400px;
    height: 250px;
  }

  /* Main spacecraft body */
  .ship-body {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 60px;
    background: linear-gradient(to bottom, #8899aa, #556677 30%, #334455 70%, #223344);
    clip-path: polygon(0% 50%, 8% 20%, 35% 5%, 65% 5%, 92% 20%, 100% 50%, 92% 80%, 65% 95%, 35% 95%, 8% 80%);
    box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);
  }

  /* Cockpit window */
  .ship-body::before {
    content: '';
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 18px;
    background: linear-gradient(to bottom, #aaddff, #4488cc);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(100, 200, 255, 0.6), 0 0 20px rgba(100, 200, 255, 0.3);
  }

  /* Wings */
  .wing-left, .wing-right {
    position: absolute;
    top: 55px;
    width: 120px;
    height: 80px;
    z-index: -1;
  }
  .wing-left {
    left: 20px;
    background: linear-gradient(135deg, #445566, #334455 50%, #223344);
    clip-path: polygon(100% 20%, 100% 60%, 30% 100%, 0% 80%, 0% 50%);
  }
  .wing-right {
    right: 20px;
    background: linear-gradient(225deg, #445566, #334455 50%, #223344);
    clip-path: polygon(0% 20%, 0% 60%, 70% 100%, 100% 80%, 100% 50%);
  }

  /* Engine glow */
  .engine-glow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 140px;
    background: linear-gradient(to bottom,
      rgba(100, 200, 255, 0.9) 0%,
      rgba(50, 150, 255, 0.6) 20%,
      rgba(30, 100, 255, 0.3) 50%,
      rgba(20, 50, 200, 0.1) 80%,
      transparent 100%);
    clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
    animation: engine-pulse 2s ease-in-out infinite alternate;
    filter: blur(3px);
  }
  .engine-glow::before {
    content: '';
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 60%;
    background: radial-gradient(ellipse at center top, rgba(200, 240, 255, 0.8), transparent 70%);
    animation: engine-core 1.5s ease-in-out infinite alternate;
  }

  @keyframes engine-pulse {
    0% { opacity: 0.7; height: 130px; }
    100% { opacity: 1; height: 150px; }
  }
  @keyframes engine-core {
    0% { opacity: 0.8; }
    100% { opacity: 1; }
  }

  /* === REVII GLYPH (orbiting the ship) === */
  .revii-orbit {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 200px;
    z-index: 6;
    animation: orbit-rotate 12s linear infinite;
  }
  .revii-glyph {
    position: absolute;
    top: 0;
    left: 0;
    width: 36px;
    height: 36px;
    border: 2px solid #00d4aa;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(0, 212, 170, 0.6), 0 0 25px rgba(0, 212, 170, 0.3);
    animation: revii-pulse 2s ease-in-out infinite alternate;
  }
  .revii-glyph::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    background: #00d4aa;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 8px rgba(0, 212, 170, 0.8);
  }
  .revii-glyph::after {
    content: '';
    position: absolute;
    top: -6px;
    right: -4px;
    width: 10px;
    height: 10px;
    border-top: 2px solid #00d4aa;
    border-right: 2px solid #00d4aa;
    transform: rotate(45deg);
  }

  @keyframes orbit-rotate {
    0% { transform: translateX(-50%) rotate(0deg); }
    100% { transform: translateX(-50%) rotate(360deg); }
  }
  @keyframes revii-pulse {
    0% { box-shadow: 0 0 12px rgba(0,212,170,0.6), 0 0 25px rgba(0,212,170,0.3); }
    100% { box-shadow: 0 0 18px rgba(0,212,170,0.8), 0 0 40px rgba(0,212,170,0.4); }
  }

  /* === TITLE: EXECUTE === */
  .title-execute {
    position: absolute;
    top: 530px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .title-execute h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 128px;
    letter-spacing: 22px;
    color: #ffffff;
    text-shadow:
      0 0 20px rgba(100, 180, 255, 0.5),
      0 0 60px rgba(50, 120, 255, 0.2),
      0 2px 4px rgba(0,0,0,0.8);
    line-height: 1;
    animation: title-glow 4s ease-in-out infinite alternate;
  }

  @keyframes title-glow {
    0% { text-shadow: 0 0 20px rgba(100,180,255,0.5), 0 0 60px rgba(50,120,255,0.2), 0 2px 4px rgba(0,0,0,0.8); }
    100% { text-shadow: 0 0 30px rgba(100,180,255,0.7), 0 0 80px rgba(50,120,255,0.3), 0 2px 4px rgba(0,0,0,0.8); }
  }

  /* === TAGLINE === */
  .tagline {
    position: absolute;
    top: 660px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .tagline p {
    font-family: 'Oswald', sans-serif;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 4px;
    color: rgba(200, 220, 255, 0.85);
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(100,180,255,0.3);
  }

  /* === SUBTITLE === */
  .subtitle {
    position: absolute;
    top: 700px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .subtitle p {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 6px;
    color: rgba(180, 200, 230, 0.7);
    text-transform: uppercase;
  }

  /* === SUMMIT LOGO SECTION === */
  .summit-logo-section {
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .summit-logo-section img {
    width: 260px;
    height: auto;
    opacity: 0.85;
    filter: drop-shadow(0 0 10px rgba(100,150,220,0.2));
  }

  /* === BILLING BLOCK === */
  .billing-block {
    position: absolute;
    bottom: 40px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .billing-block .billing-text {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(150, 170, 200, 0.5);
    text-transform: uppercase;
    border-top: 1px solid rgba(150,170,200,0.15);
    border-bottom: 1px solid rgba(150,170,200,0.15);
    display: inline-block;
    padding: 6px 20px;
  }

  /* === RATING BOX === */
  .rating-box {
    position: absolute;
    bottom: 8px;
    right: 20px;
    z-index: 10;
    border: 1px solid rgba(150,170,200,0.3);
    padding: 3px 8px;
  }
  .rating-box .rating-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: rgba(150,170,200,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .rating-box .rating-desc {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 300;
    font-size: 7px;
    color: rgba(150,170,200,0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* === ATMOSPHERIC LIGHT BEAMS === */
  .light-beam {
    position: absolute;
    z-index: 3;
  }
  .light-beam-1 {
    top: 0;
    left: 30%;
    width: 2px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 0%, rgba(100,180,255,0.05) 30%, rgba(100,180,255,0.08) 50%, rgba(100,180,255,0.03) 70%, transparent 100%);
    transform: rotate(5deg);
  }
  .light-beam-2 {
    top: 0;
    right: 25%;
    width: 3px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 0%, rgba(255,180,100,0.04) 20%, rgba(255,180,100,0.06) 40%, rgba(255,180,100,0.02) 60%, transparent 100%);
    transform: rotate(-3deg);
  }

  /* === LENS FLARE === */
  .lens-flare {
    position: absolute;
    top: 140px;
    right: 100px;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, rgba(255,220,180,0.4), transparent 70%);
    z-index: 7;
    animation: flare-pulse 5s ease-in-out infinite alternate;
  }
  .lens-flare::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -40px;
    width: 110px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,220,180,0.15), transparent);
    transform: translateY(-50%);
  }

  @keyframes flare-pulse {
    0% { opacity: 0.5; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* === DAMAGE SPARKS around ship === */
  .sparks {
    position: absolute;
    top: 320px;
    left: 200px;
    width: 4px;
    height: 4px;
    background: #ffcc44;
    border-radius: 50%;
    box-shadow:
      30px -5px 3px #ffaa22,
      60px 10px 2px #ff8800,
      -20px 15px 3px #ffcc44,
      90px -10px 2px #ffaa22,
      120px 5px 3px #ff8800,
      250px -8px 2px #ffcc44,
      280px 12px 3px #ffaa22;
    z-index: 6;
    animation: spark-flicker 0.8s ease-in-out infinite alternate;
  }

  @keyframes spark-flicker {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
  }

  /* Vignette overlay */
  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 8;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }

  /* Top presents text */
  .presents {
    position: absolute;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;
  }
  .presents p {
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 5px;
    color: rgba(180, 200, 230, 0.5);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Star field background -->
  <div class="starfield"></div>

  <!-- Nebula atmosphere -->
  <div class="nebula"></div>

  <!-- Atmospheric light beams -->
  <div class="light-beam light-beam-1"></div>
  <div class="light-beam light-beam-2"></div>

  <!-- Mars - destination -->
  <div class="mars"></div>

  <!-- Lens flare near Mars -->
  <div class="lens-flare"></div>

  <!-- Presents line -->
  <div class="presents">
    <p>Rev.io Summit 2026 Presents</p>
  </div>

  <!-- Spacecraft assembly -->
  <div class="spacecraft-container">
    <!-- Revii orbit glyph -->
    <div class="revii-orbit">
      <div class="revii-glyph"></div>
    </div>

    <div class="wing-left"></div>
    <div class="wing-right"></div>
    <div class="ship-body"></div>
    <div class="engine-glow"></div>
  </div>

  <!-- Damage sparks -->
  <div class="sparks"></div>

  <!-- EXECUTE title -->
  <div class="title-execute">
    <h1>EXECUTE</h1>
  </div>

  <!-- Tagline -->
  <div class="tagline">
    <p>When the system fails, the mission doesn't.</p>
  </div>

  <!-- Subtitle -->
  <div class="subtitle">
    <p>A Rev.io Summit 2026 Film</p>
  </div>
